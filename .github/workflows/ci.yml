name: CI - MAXCUT Regression & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Regression Suite & Artifact Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run automated unit and regression test suite
        id: run_tests
        env:
          PYTHONPATH: .
          MPLBACKEND: Agg
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v --tb=short tests 2>&1 | tee /tmp/test_output.log

      - name: Log Test Results and Summary
        if: always()
        run: |
          echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/test_output.log ]; then
            tail -n 80 /tmp/test_output.log >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Validate required artifacts and pre-rendered notebook
        env:
          PYTHONPATH: .
          MPLBACKEND: Agg
        run: |
          python scripts/validate_artifacts.py

      - name: Verify working tree clean (no committed artifacts rewritten)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
