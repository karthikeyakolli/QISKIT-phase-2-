[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maxcut"
version = "0.1.0"
description = "Qiskit Fall Fest 2026 — O1 Max-Cut Quantum Optimization Package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0.0",
    "qiskit-aer>=0.16.0",
    "qiskit-ibm-runtime>=0.40.0",
    "networkx>=3.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast deterministic unit tests",
    "integration: Multi-component integration tests",
    "slow: Computationally heavy simulations or notebook runs"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]

